name: warmup

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping pullscape
        run: |
          curl -sf --max-time 30 \
            "https://pullscape.fly.dev/api/github-pr-stats?username=fematarazzo&theme=dark&min_stars=1000&limit=10" \
            -o /dev/null
